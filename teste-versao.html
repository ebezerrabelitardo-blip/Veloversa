<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste de versão · VELOVERSA</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#05060f;color:#fff;font:17px/1.45 -apple-system,system-ui,sans-serif;padding:24px}
.c{max-width:420px;width:100%;text-align:center}h1{font-size:1.5rem;margin:0 0 6px}.ok{font-size:3rem}.b{margin:18px 0;padding:16px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16)}
.v{font-size:2rem;font-weight:800;letter-spacing:.5px}.g{color:#4be0a1}.r{color:#ff6b86}a{display:inline-block;margin-top:10px;padding:13px 22px;border-radius:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;font-weight:700;text-decoration:none}small{opacity:.65}</style></head>
<body><div class="c"><div class="ok">✅</div><h1>O upload funcionou</h1>
<p>Esta página foi publicada no seu GitHub Pages.</p>
<div class="b"><small>O arquivo <b>index.html</b> que o seu site está entregando agora é a versão:</small><div class="v" id="v">verificando…</div><div id="m"></div></div>
<a href="./">Abrir o VELOVERSA</a><p><small>Esperado: <b>8.4</b></small></p></div>
<script>
fetch('./index.html?x='+Date.now(),{cache:'no-store'}).then(r=>r.text().then(t=>({r,t}))).then(({r,t})=>{
 var m=t.match(/const VER='([\d.]+)'/),v=document.getElementById('v'),d=document.getElementById('m');
 if(!r.ok){v.textContent='não encontrado';v.className='v r';d.textContent='O arquivo index.html não está nesta pasta do site.';return}
 if(!m){v.textContent='desconhecida';v.className='v r';d.textContent='Existe um index.html, mas não é o do VELOVERSA.';return}
 v.textContent='v'+m[1];
 if(m[1]==='8.4'){v.className='v g';d.textContent='Tudo certo: o site está na versão mais nova.'}
 else{v.className='v r';d.textContent='O site ainda está com uma versão antiga. Envie o index.html de novo (nome exato: index.html) e confirme o envio em “Commit changes”.'}
}).catch(function(){var v=document.getElementById('v');v.textContent='sem resposta';v.className='v r';document.getElementById('m').textContent='Não consegui ler o index.html. Abra esta página pelo endereço do site, e não pelo arquivo baixado.'});
</script></body></html>
