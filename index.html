<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VELOVERSA</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5f5f8;--sf:#fff;--tx:#12121a;--mu:#6c6c7c;--ln:#e3e3ec;--ac:#6d4aff;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#0a0a0d;--sf:#16161b;--tx:#f4f4f7;--mu:#9a9aa8;--ln:#26262e;--ac:#8b6bff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0d;--sf:#16161b;--tx:#f4f4f7;--mu:#9a9aa8;--ln:#26262e;--ac:#8b6bff}}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:16px}html.big{font-size:19px}
html.calm *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--ac)}
#app{height:100%;max-width:480px;margin:auto;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--ln)}
.logo{display:flex;align-items:center;gap:8px;flex:1;font-weight:800;letter-spacing:.22em;font-size:.95rem}
.logo svg{width:26px;height:26px}
#main{flex:1;overflow:auto;overscroll-behavior:contain}
nav{display:flex;justify-content:space-around;align-items:center;padding:8px 0;border-top:1px solid var(--ln);background:var(--bg)}
nav button{padding:8px 14px;color:var(--mu);border-radius:12px}nav button.on{color:var(--tx)}
nav .cr{background:var(--ac);color:#fff;padding:8px 16px}
.demo{font-size:.72rem;color:var(--mu);text-align:center;padding:6px}
.row{display:flex;gap:14px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;min-width:66px;color:var(--mu)}
.rg{padding:3px;border-radius:50%;background:var(--ac)}.rg.s{background:var(--ln)}.rg.n{background:none;border:2px dashed var(--ln)}
.rg .av{border:3px solid var(--bg)}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;flex:none}
.pc{border-bottom:1px solid var(--ln);padding-bottom:10px}
.ph{display:flex;align-items:center;gap:10px;padding:10px 16px}.ph .mu{flex:1}
.mu{color:var(--mu);font-size:.8rem}
.lk{color:var(--ac);font-weight:600;font-size:.85rem}
.md{aspect-ratio:3/4;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.md img,.md video{width:100%;height:100%;object-fit:cover}
.gl{position:absolute;font-size:5rem;opacity:.25;font-style:normal;color:#fff}
.ac{display:flex;gap:4px;padding:6px 10px}.ac button{padding:6px}.ac .r{margin-left:auto}
.on{color:#ff3b6b}.on2{color:var(--ac)}
.tx{padding:0 16px;font-size:.92rem}.tx p{margin:4px 0}.tg{color:var(--ac)}
.tx a{cursor:pointer}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.gt{aspect-ratio:3/4;position:relative;overflow:hidden;cursor:pointer}.gt img{width:100%;height:100%;object-fit:cover}
.gt i{position:absolute;top:6px;right:6px;font-style:normal;font-size:.7rem;background:#0008;color:#fff;border-radius:6px;padding:1px 5px}
.hd{display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:700}.hd span{flex:1}
.li{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer}.li div{flex:1;min-width:0}.li p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--mu);padding:48px 24px}
.bt{background:var(--ac);color:#fff;border-radius:12px;padding:10px 16px;font-weight:600;width:100%}
.bt.g{background:var(--sf);color:var(--tx);border:1px solid var(--ln)}
.pf{display:flex;align-items:center;gap:24px;padding:12px 16px}.pf div{text-align:center}.pf b{display:block;font-size:1.1rem}
.tabs{display:flex;border-bottom:1px solid var(--ln)}.tabs button{flex:1;padding:12px;color:var(--mu)}.tabs .on{color:var(--tx);border-bottom:2px solid var(--tx)}
#sh{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}#sh[hidden],#ov[hidden],#sv[hidden]{display:none}
.bk{position:absolute;inset:0;background:#0009}
#sb{position:relative;max-width:480px;width:100%;margin:auto;background:var(--sf);border-radius:20px 20px 0 0;padding:16px;max-height:88%;overflow:auto;animation:up .2s}
@keyframes up{from{transform:translateY(30px);opacity:0}}
#sb h3{margin:0 0 12px}#sb .pc{border:0;margin:-16px -16px 0}
.tg2{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}
.sw{width:46px;height:28px;border-radius:14px;background:var(--ln);position:relative;transition:.2s}.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--ac)}.sw.on:after{left:21px}
#ov,#sv{position:fixed;inset:0;z-index:30;background:var(--bg)}#sv{background:#000;z-index:40}
#ov>div{max-width:480px;margin:auto;height:100%;display:flex;flex-direction:column}
.rl{flex:1;overflow:auto;scroll-snap-type:y mandatory;background:#000}
.rs{height:100%;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
.rs video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rr{position:absolute;right:10px;bottom:90px;display:flex;flex-direction:column;gap:14px;align-items:center;font-size:.75rem}
.rb{position:absolute;left:14px;right:70px;bottom:24px;font-size:.9rem;text-shadow:0 1px 4px #000a}
.rtop{position:absolute;top:8px;left:8px;z-index:2;color:#fff;display:flex;align-items:center;gap:10px;font-weight:700}
.stb{max-width:480px;margin:auto;height:100%;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
.stb img,.stb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pg{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:2}.pg i{flex:1;height:3px;background:#fff5;border-radius:2px;overflow:hidden}.pg i.d{background:#fff}.pg b{display:block;height:100%;background:#fff;animation:pr 5s linear forwards}
@keyframes pr{from{width:0}to{width:100%}}
.sh2{position:absolute;top:22px;left:12px;right:12px;display:flex;align-items:center;gap:8px;z-index:3;font-size:.85rem}.sh2 span{flex:1;opacity:.7}
.stx{position:relative;z-index:1;font-size:1.6rem;font-weight:700;text-align:center;padding:24px;text-shadow:0 2px 8px #0008}
.stb .l,.stb .r{position:absolute;top:70px;bottom:0;width:40%;z-index:2}.stb .l{left:0}.stb .r{right:0}
#msgs{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.bb{max-width:75%;padding:8px 12px;border-radius:16px;background:var(--sf);border:1px solid var(--ln);align-self:flex-start;overflow-wrap:anywhere}.bb.me{align-self:flex-end;background:var(--ac);color:#fff;border-color:var(--ac)}
.cb{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--ln)}.cb button{color:var(--ac);font-weight:600}
#tt{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:.85rem;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}#tt.on{opacity:1;color:var(--bg)}
#au{position:fixed;inset:0;z-index:60;overflow:auto;background:radial-gradient(520px 320px at 50% -5%,#6d4aff55,transparent),var(--bg)}#au[hidden]{display:none}
.ab{max-width:400px;margin:auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:32px 24px}.ab h1{margin:8px 0 0;font-size:1.7rem;letter-spacing:-.02em}.ab p{margin:0}
.pw{position:relative}.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ac);font-size:.8rem;font-weight:600}
.pbar{height:4px;border-radius:2px;background:var(--ln);overflow:hidden}.pbar i{display:block;height:100%;width:0;transition:.25s}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:.85rem;color:var(--mu)}.ck input{width:auto;margin-top:3px}.er{color:#ff5a6a;font-size:.85rem;min-height:1.2em}label.mu input{margin-top:4px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:20px;background:var(--sf);border:1px solid var(--ln);font-size:.8rem;margin:6px 0 0 16px;font-weight:600}
.pop svg{animation:pp .45s cubic-bezier(.2,2,.4,1)}@keyframes pp{0%{transform:scale(.4)}60%{transform:scale(1.5)}100%{transform:scale(1)}}
.bh{position:absolute;font-size:7rem;color:#fff;font-style:normal;animation:bh .8s ease-out forwards;pointer-events:none;text-shadow:0 4px 24px #ff3b6baa}@keyframes bh{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(1.6);opacity:0}}
.pc{background:var(--sf);border:1px solid var(--ln);border-radius:22px;margin:10px 12px;overflow:hidden}
.rg{background:conic-gradient(from 200deg,#8b6bff,#3d8bff,#d24bff,#8b6bff)}
.nt{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:4px 8px;font-size:.7rem;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header{background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(16px)}
nav .cr{background:linear-gradient(135deg,var(--ac),#3d8bff);box-shadow:0 6px 18px #6d4aff66}nav button,.ac button{transition:transform .12s}nav button:active,.ac button:active{transform:scale(.88)}
@media(max-width:899px){nav{margin:6px 12px 10px;border:1px solid var(--ln);border-radius:30px;background:color-mix(in srgb,var(--sf) 82%,transparent);backdrop-filter:blur(18px)}}
@media(min-width:900px){#app{max-width:none;padding-left:84px}#app>header,#main>*{max-width:560px;margin-left:auto;margin-right:auto}
nav{position:fixed;left:0;top:0;bottom:0;width:84px;flex-direction:column;justify-content:flex-start;gap:12px;padding-top:24px;border-top:0;border-right:1px solid var(--ln)}}
</style>
<script>/* Limpeza única: apaga dados locais antigos (demonstração) */try{if(!localStorage.getItem('vvreset2')){localStorage.removeItem('vv1');localStorage.removeItem('vvacct');localStorage.setItem('vvreset2','1');window.RESET=1}}catch(e){}window.REC=/type=recovery/.test(location.hash);window.EXP=/otp_expired/.test(location.hash);window.addEventListener('error',e=>{if(document.getElementById('dbg'))return;const d=document.createElement('div');d.id='dbg';d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99999;background:#b00020;color:#fff;font:12px/1.4 sans-serif;padding:8px';d.textContent='Erro: '+(e.message||'desconhecido')+' (linha '+e.lineno+')';document.body.appendChild(d)});</script>
</head>
<body>
<div id="app">
<header id="hd"></header>
<main id="main"></main>
<nav aria-label="Navegação principal">
<button data-a="tab" data-i="home" aria-label="Início"></button>
<button data-a="tab" data-i="exp" aria-label="Explorar"></button>
<button class="cr" data-a="create" aria-label="Criar"></button>
<button data-a="tab" data-i="msg" aria-label="Mensagens"></button>
<button data-a="tab" data-i="me" aria-label="Perfil"></button>
</nav>
</div>
<div id="sh" hidden><div class="bk" data-a="close"></div><div id="sb"></div></div>
<div id="au" hidden></div><div id="ov" hidden></div><div id="sv" hidden></div><div id="tt" role="status"></div>
<input type="file" id="fi" hidden>
<input type="file" id="fav" accept="image/*" hidden>
<input type="file" id="fcv" accept="image/*" hidden>
<script>
const VER='3.1';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P={home:'M3 11l9-8 9 8v10h-6v-6H9v6H3z',search:'M11 4a7 7 0 100 14 7 7 0 000-14zM21 21l-5-5',plus:'M12 5v14M5 12h14',send:'M22 3L9.5 13.5M22 3l-7 18-5.5-7.5L2 10z',user:'M12 3a4.5 4.5 0 100 9 4.5 4.5 0 000-9zM4 21c0-4.4 3.6-7 8-7s8 2.6 8 7',heart:'M12 21s-8-5-8-11a4.5 4.5 0 018-3 4.5 4.5 0 018 3c0 6-8 11-8 11z',cm:'M21 12a8 8 0 01-11.5 7.2L3 21l1.8-6A8 8 0 1121 12z',bm:'M6 3h12v18l-6-4-6 4z',reel:'M4 4h16v16H4zM10 9l5 3-5 3z',x:'M5 5l14 14M19 5L5 19',menu:'M4 6h16M4 12h16M4 18h16',back:'M15 5l-7 7 7 7',edit:'M4 20h4L19 9l-4-4L4 16zM14 6l4 4'};
const ic=(n,f)=>`<svg viewBox="0 0 24 24" width="24" height="24" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const hh=u=>Math.abs([...String(u)].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7))%360;
const art=h=>`background:linear-gradient(145deg,hsl(${h} 70% 48%),hsl(${(h+70)%360} 75% 22%))`;
const AVT={};let storyRow=()=>'';
const av=(u,s=40)=>AVT[u]?`<img class="av" src="${esc(AVT[u])}" alt="" style="width:${s}px;height:${s}px;object-fit:cover">`:`<span class="av" style="width:${s}px;height:${s}px;${art(hh(u))}">${esc((u||'?')[0]).toUpperCase()}</span>`;
const ago=t=>{const m=(Date.now()-t)/6e4|0;return m<1?'agora':m<60?m+' min':m<1440?(m/60|0)+' h':(m/1440|0)+' d'};
const tags=s=>esc(s).replace(/#\w+/g,m=>`<span class="tg">${m}</span>`);
const U=[];
const CAP=['Luz da tarde e silêncio #luz #foco','Novo projeto saindo do forno #design #veloversa','Fim de semana sem plano #descanso','Código, café e playlist nova #dev','Cores do dia #arte #cor','Caminhada ao amanhecer #foco #natureza'];
let S=null;try{S=JSON.parse(localStorage.getItem('vv1'))}catch(e){}
if(!S)S={theme:'dark',me:{u:'',n:'',b:''},priv:0,big:0,calm:0,fol:{},my:[],
 posts:[],
 chats:{}};
const save=()=>{try{localStorage.setItem('vv1',JSON.stringify(S,(k,v)=>k=='vid'?undefined:v))}catch(e){toast('Armazenamento cheio: libere espaço')}};
S.top=S.top||{};S.str=S.str||{d:0,n:0};S.links=S.links||[];S.note=S.note||'';
let mode=S.acct?'in':'up',fails=0,lock=0,aw=0,pop=null;
const dayN=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
function streak(){const d=dayN();if(S.str.d==d)return;S.str.n=S.str.d==d-1?S.str.n+1:1;S.str.d=d;save()}
const s64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hp(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return s64(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,256))}
const pwScore=p=>[p.length>=8,/[A-Z]/.test(p)&&/[a-z]/.test(p),/\d/.test(p),/[^\w\s]/.test(p)].filter(Boolean).length;
const sc=p=>{let s=-(Date.now()-p.t)/36e5;(p.cap.match(/#\w+/g)||[]).forEach(h=>s+=(S.top[h]||0)*6);return s};
const allTags=()=>[...new Set(S.posts.flatMap(p=>p.cap.match(/#\w+/g)||[]))];
const authHtml=()=>{if(window.REC||mode=='rec')return recHtml();const up=mode=='up';return `<div class="ab"><div class="logo" style="flex:none;justify-content:center;font-size:1.1rem">${LOGO}VELOVERSA</div><h1>${up?'Crie sua conta':'Bem-vindo de volta'}</h1><p class="mu">${up?'Compartilhe momentos, descubra tendências e crie comunidades.':'Entre para continuar no seu universo.'}</p>${up?'<input id="ae" type="email" autocomplete="email" placeholder="E-mail" aria-label="E-mail"><input id="auu" autocomplete="username" autocapitalize="none" maxlength="20" placeholder="Nome de usuário" aria-label="Nome de usuário">':'<input id="ai" autocomplete="username" autocapitalize="none" placeholder="E-mail" aria-label="E-mail">'}<div class="pw"><input id="ap" type="password" autocomplete="${up?'new-password':'current-password'}" placeholder="Senha" aria-label="Senha"><button type="button" class="eye" data-a="eye">Mostrar</button></div>${up?'<div class="pbar"><i id="pb"></i></div><label class="mu">Data de nascimento<input id="ab" type="date"></label><label class="ck"><input id="at" type="checkbox"> Aceito os Termos de Uso e a Política de Privacidade</label>':''}${up?'':'<button class="lk" data-a="forgot">Esqueci minha senha</button>'}<p id="er" class="er" role="alert"></p><button class="bt" data-a="auth">${up?'Criar conta':'Entrar'}</button><button class="lk" data-a="mode">${up?'Já tenho conta':'Criar conta nova'}</button><p class="mu" style="font-size:.72rem;text-align:center">Conta online: use o mesmo login em qualquer aparelho. (v${VER})</p></div>`};
const recHtml=()=>{const n=window.REC;return `<div class="ab"><div class="logo" style="flex:none;justify-content:center;font-size:1.1rem">${LOGO}VELOVERSA</div><h1>${n?'Criar nova senha':'Recuperar senha'}</h1><p class="mu">${n?'Escolha uma senha forte: 8+ caracteres com maiúsculas, minúsculas e números.':'Informe o e-mail da sua conta e enviaremos um link para você criar uma nova senha.'}</p>${n?'<div class="pw"><input id="np" type="password" autocomplete="new-password" placeholder="Nova senha" aria-label="Nova senha"></div><div class="pw"><input id="np2" type="password" autocomplete="new-password" placeholder="Repita a nova senha" aria-label="Repita a nova senha"></div>':'<input id="ar" type="email" autocomplete="email" placeholder="E-mail" aria-label="E-mail">'}<p id="er" class="er" role="alert"></p><button class="bt" data-a="${n?'rset':'rsend'}">${n?'Salvar nova senha':'Enviar link'}</button>${n?'':'<button class="lk" data-a="back">Voltar para o login</button>'}</div>`};
const authShow=()=>{const a=$('#au');a.hidden=false;a.innerHTML=authHtml()};
document.addEventListener('input',e=>{if(e.target.id=='ap'&&mode=='up'){const n=pwScore(e.target.value),b=$('#pb');b.style.width=n*25+'%';b.style.background=['#e5484d','#e5484d','#f5a524','#3dd68c','#3dd68c'][n]}});
const algoHtml=()=>`<h3>Seu algoritmo</h3><p class="mu">Escolha o que aparece mais ou menos no seu feed. Isso muda a ordem real das publicações.</p>${allTags().map(h=>`<div class="tg2"><span>${h}</span><button class="lk" data-a="topic" data-i="${h}">${['Ocultar','Normal','Mais'][(S.top[h]||0)+1]}</button></div>`).join('')}`;
let tab='home',shf=null,ovf=null,seen={},tm,pend={},cur='',q='',FD={from:0,done:0,busy:0,err:0};
const find=id=>S.posts.find(p=>p.id==id);
function toast(t){const e=$('#tt');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
function theme(){document.documentElement.dataset.theme=S.theme;document.documentElement.classList.toggle('big',!!S.big);document.documentElement.classList.toggle('calm',!!S.calm)}
const LOGO=`<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 8l11 18L27 8" fill="none" stroke="var(--ac)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="5.5" r="2.6" fill="var(--tx)"/></svg>`;
function vidErr(v){const p=v.getAttribute('poster');v.outerHTML=(p?`<img src="${p}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`:'')+'<span style="position:absolute;left:8px;right:8px;bottom:8px;text-align:center;color:#fff;background:#000a;border-radius:8px;padding:6px;font-size:.8rem">Este aparelho não consegue reproduzir este vídeo</span>'}

const media=p=>(p.img?`<img src="${p.img}" alt="Foto de ${esc(p.u)}">`:p.vid?`<video src="${p.vid}" ${p.cover?`poster="${p.cover}"`:''} playsinline controls preload="${p.cover?'none':'metadata'}" onerror="vidErr(this)"></video>`:`<i class="gl">✦</i>${p.v?'<span class="mu" style="position:relative;color:#fff">Vídeo disponível só na sessão em que foi enviado</span>':''}`);

let io=null;
function setupMore(){if(io){io.disconnect();io=null}const m=$('#more');if(!m||FD.done||!ME||!('IntersectionObserver' in window))return;
 io=new IntersectionObserver(es=>{if(es.some(x=>x.isIntersecting))loadPosts(1)},{root:$('#main'),rootMargin:'600px'});io.observe(m)}

// --- Capa do vídeo ---
let cvTarget=null;
// Tira uma imagem de um momento (t, em segundos) do vídeo
const frameAt=(url,t)=>new Promise((ok,no)=>{const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';
 const fim=setTimeout(()=>no(new Error('tempo')),10000);
 v.onloadedmetadata=()=>{const d=v.duration||0;v.currentTime=t==null?Math.min(1,d*.1):Math.min(t,Math.max(d-.05,0))};
 v.onseeked=()=>{try{const r=Math.min(1,720/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=Math.round(v.videoWidth*r);c.height=Math.round(v.videoHeight*r);
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);clearTimeout(fim);ok({url:c.toDataURL('image/jpeg',.8),dur:v.duration||0})}catch(e){no(e)}};
 v.onerror=()=>{clearTimeout(fim);no(new Error('video'))};v.src=url;v.load()});
async function autoCover(t){try{const r=await frameAt(pend.vid,t);pend.cover=r.url;pend.dur=r.dur;pend.t=t==null?Math.min(1,r.dur*.1):t}
 catch(e){console.error(e);pend.cover=null;pend.dur=0;toast('Não foi possível gerar a capa. Escolha uma imagem.')}
 if(shf===coverHtml)draw()}
// Tela de publicação de vídeo com escolha de capa
const coverHtml=()=>`<h3>Nova publicação · ${pend.kind}</h3>
<div class="md" style="aspect-ratio:3/4;max-height:46vh;border-radius:12px;margin:0 auto 8px;${pend.cover?'':art(200)}">${pend.cover?`<img src="${pend.cover}" alt="Capa do vídeo">`:'<span class="mu" style="color:#fff">Capa do vídeo</span>'}<i class="gl" style="font-size:3rem;opacity:.85">▶</i></div>
<p class="mu" style="margin:4px 0">Capa: escolha o momento do vídeo ou use outra imagem.</p>
${pend.dur?`<input type="range" id="ct" min="0" max="${Math.floor(pend.dur*10)}" value="${Math.floor((pend.t||0)*10)}" aria-label="Momento da capa">`:''}
<button class="bt g" style="margin-top:8px" data-a="cvpick">Usar outra imagem como capa</button>
<textarea id="cap" maxlength="500" placeholder="Legenda... use #hashtags" style="margin-top:8px">${esc(pend.cap||'')}</textarea><button class="bt" style="margin-top:12px" data-a="pub">Publicar</button>`;
{const oc=A.compose;A.compose=()=>{if(pend.vid&&(pend.kind=='video'||pend.kind=='reel')){pend.cover=null;pend.dur=0;pend.cap='';sheet(coverHtml);autoCover();return}oc()}}
document.addEventListener('change',e=>{if(e.target.id=='ct'){const c=$('#cap');if(c)pend.cap=c.value;pend.t=e.target.value/10;autoCover(pend.t)}});
A.cvpick=()=>{const c=$('#cap');if(c)pend.cap=c.value;cvTarget=null;const f=$('#fcv');f.value='';f.click()};
A.cover=id=>{const p=find(id);if(!p||!p.oid)return;cvTarget=id;const f=$('#fcv');f.value='';f.click()};
// Troca a capa de um vídeo que já foi publicado
async function saveCover(id,data){const p=find(id);if(!p||!p.oid||!p.path)return;toast('Enviando capa...');
 const B=sb.storage.from('media'),cp=p.path.replace(/\.[^./]+$/,'.cover.jpg'),blob=await(await fetch(data)).blob();
 try{await B.remove([cp])}catch(e){}
 const up=await B.upload(cp,blob,{contentType:'image/jpeg'});if(up.error)return toast('Não foi possível trocar a capa');
 p.cover=B.getPublicUrl(cp).data.publicUrl+'?v='+Date.now();R();toast('Capa atualizada!')}
$('#fcv').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('Escolha uma imagem');
 try{const url=URL.createObjectURL(f),im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
  const r=Math.min(1,1080/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);const data=c.toDataURL('image/jpeg',.85);
  if(cvTarget){const id=cvTarget;cvTarget=null;await saveCover(id,data)}else{pend.cover=data;if(shf===coverHtml)draw()}}
 catch(err){console.error(err);toast('Imagem inválida')}};

{const o=A.nsave;A.nsave=()=>{o();soon('note','Notas para os amigos: em breve vai funcionar!')}}
</script>

viewStory=function(u,i){clearTimeout(tm);const L=ST[u]||[];if(!L.length||i>=L.length)return A.sx();if(!(i>0))i=0;
 const s=L[i],mine=u==S.me.u,D=s.vid?30000:5000;seen[u]=1;const o=$('#sv');o.hidden=false;
 o.innerHTML=`<div class="stb" style="${art(hh(u))}">${s.img?`<img src="${esc(s.img)}" alt="" onerror="stErr(this)">`:''}${s.vid?`<video id="svv" src="${esc(s.vid)}" muted autoplay playsinline onerror="stErr(this)"></video>`:''}<div class="pg">${L.map((_,k)=>`<i class="${k<i?'d':''}">${k==i?`<b style="animation-duration:${D/1e3}s"></b>`:''}</i>`).join('')}</div><div class="sh2"><button data-a="sprof" data-i="${esc(u)}" style="display:flex;align-items:center;gap:8px;color:#fff">${av(u,32)}<b>${esc(u)}</b></button><span>${ago(s.t)}</span>${s.vid?'<button data-a="smute" id="smb" style="color:#fff" aria-label="Som">🔇</button>':''}${mine?`<button data-a="delst" data-i="${s.id}" aria-label="Apagar story" style="color:#fff">Apagar</button>`:''}<button data-a="sx" aria-label="Fechar" style="color:#fff">${ic('x')}</button></div><p class="stx">${tags(s.tx||'')}</p><i class="l" data-a="sp"></i><i class="r" data-a="sn"></i>${mine?'':`<div class="srep"><input id="sri" maxlength="300" placeholder="Enviar mensagem..." aria-label="Responder ao story" autocomplete="off"><button data-a="slike" aria-label="Curtir story">♡</button><button data-a="ssend" aria-label="Enviar">${ic('send')}</button></div>`}</div>`;
 o._s=[u,i];o._D=D;o._t0=Date.now();o._rem=D;o._held=0;const v=$('#svv');
 if(v){v.onended=()=>viewStory(u,i+1);v.onloadedmetadata=()=>{const b=$('#sv .pg b');if(b&&v.duration)b.style.animationDuration=v.duration+'s'};v.play().catch(()=>{})}
 tm=setTimeout(()=>viewStory(u,i+1),D)};
function pauseSt(){const o=$('#sv');if(o.hidden||!o.firstChild)return;clearTimeout(tm);o._rem=Math.max(300,o._D-(Date.now()-o._t0));o.firstChild.classList.add('hold');const v=$('#svv');v&&v.pause()}
function resumeSt(){const o=$('#sv');if(o.hidden||!o._s||!o.firstChild)return;const[u,i]=o._s;o.firstChild.classList.remove('hold');const v=$('#svv');v&&v.play().catch(()=>{});o._D=o._rem;o._t0=Date.now();clearTimeout(tm);tm=setTimeout(()=>viewStory(u,i+1),o._rem);setTimeout(()=>{o._held=0},60)}
document.addEventListener('pointerdown',e=>{const o=$('#sv');if(o.hidden||!e.target.closest('#sv .l,#sv .r'))return;o._held=0;clearTimeout(o._h);o._h=setTimeout(()=>{o._held=1;pauseSt()},220)});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{const o=$('#sv');if(o.hidden)return;clearTimeout(o._h);if(o._held)resumeSt()}));
document.addEventListener('focusin',e=>{if(e.target.id=='sri')pauseSt()});document.addEventListener('focusout',e=>{if(e.target.id=='sri')resumeSt()});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='sri')A.ssend()});
A.sn=()=>{const o=$('#sv');if(o._held)return;const[u,i]=o._s;viewStory(u,i+1)};
A.sp=()=>{const o=$('#sv');if(o._held)return;const[u,i]=o._s;viewStory(u,i-1)};
A.sx=()=>{$('#sv').hidden=true;clearTimeout(tm);R()};
A.sprof=u=>{A.sx();A.prof(u)};
A.smute=()=>{const v=$('#svv');if(!v)return;v.muted=!v.muted;$('#smb').textContent=v.muted?'🔇':'🔊'};
A.ssend=async()=>{const o=$('#sv'),i=$('#sri');if(!i||!o._s)return;const v=i.value.trim();if(!v)return;i.value='';await dmTo(o._s[0],'↪ Resposta ao story: '+v)};
A.slike=async()=>{const o=$('#sv');if(!o._s)return;const b=o.querySelector('.stb');b.insertAdjacentHTML('beforeend','<b class="bh" style="left:calc(50% - 3rem);top:40%">♥</b>');setTimeout(()=>{const h=b.querySelector('.bh');h&&h.remove()},800);await dmTo(o._s[0],'❤️')};

// ---------- Mensagens: busca, prévia e horário ----------
let MQ='';const lastT=u=>{const m=S.chats[u];return m&&m.length&&m[m.length-1].t||0};
const chatList=()=>{const ks=Object.keys(S.chats).filter(u=>!MQ||u.toLowerCase().includes(MQ)).sort((a,b)=>lastT(b)-lastT(a));
 return ks.length?ks.map(u=>{const m=S.chats[u],l=m[m.length-1];return `<div class="li" data-a="chat" data-i="${esc(u)}" role="button">${av(u,52)}<div><b>${esc(u)}</b><p class="mu">${l?(l.m?'Você: ':'')+(l.img&&!l.x?'📷 Foto':esc(l.x))+(l.t?' · '+ago(l.t):''):'Nova conversa'}</p></div></div>`}).join(''):`<div class="empty">${MQ?'Nenhuma conversa encontrada.':'Nenhuma conversa ainda.<br>Toque no lápis para começar uma.'}</div>`};
V.msg=function(){return `<div class="hd"><span>${esc(S.me.u)} ▾</span><button data-a="newc" aria-label="Nova mensagem">${ic('edit')}</button></div><div style="padding:0 16px 8px"><input id="mq" type="search" placeholder="Pesquisar conversas" value="${esc(MQ)}" aria-label="Pesquisar conversas"></div><div class="row"><button class="st" data-a="note"><span class="nt">${S.note?esc(S.note):'+ Nota'}</span><span class="rg">${av(S.me.u,56)}</span>Sua nota</button></div><div class="hd" style="padding-bottom:2px"><span>Mensagens</span><button class="lk" data-a="soon">Pedidos</button></div><div id="cl">${chatList()}</div>`};
document.addEventListener('input',e=>{if(e.target.id=='mq'){MQ=e.target.value.trim().toLowerCase();const c=$('#cl');if(c)c.innerHTML=chatList()}});

// ---------- Editar perfil + foto ----------
const editPage=()=>`<div><div class="hd" style="gap:8px"><button data-a="close" aria-label="Voltar">${ic('back')}</button><span>Editar perfil</span><button class="lk" data-a="esave">Concluído</button></div><div class="rl" style="scroll-snap-type:none;background:var(--bg)">
<div style="text-align:center;padding:8px 0 16px"><button data-a="avatar" aria-label="Alterar foto">${av(S.me.u,96)}</button><br><button class="lk" data-a="avatar" style="margin-top:8px">Editar foto</button></div>
<label class="fl"><span>Nome</span><input id="en" value="${esc(S.me.n)}" maxlength="40"></label>
<label class="fl"><span>Nome de usuário</span><input id="eu" value="${esc(S.me.u)}" maxlength="20" autocapitalize="none"></label>
<label class="fl"><span>Bio <em id="bc" style="font-style:normal">${(S.me.b||'').length} / 150</em></span><textarea id="eb" maxlength="150" oninput="document.getElementById('bc').textContent=this.value.length+' / 150'">${esc(S.me.b)}</textarea></label>
<label class="fl"><span>Música em destaque</span><input id="em" maxlength="60" value="${esc(S.me.mu||'')}"></label>
<label class="fl"><span>Links (até 4, um por linha, https://)</span><textarea id="el">${esc(S.links.join('\n'))}</textarea></label>
${['Pronomes','Gênero','Banners','Reordenar grade'].map(l=>`<button class="mr" data-a="soon"><span>${l}</span><i>em breve ›</i></button>`).join('')}
<div style="padding:0 16px 24px">${tg('priv',S.priv,'Conta privada')}</div></div></div>`;
A.edit=()=>{shf=null;ovl(editPage)};
const avHtml=()=>`<h3>Foto do perfil</h3><div style="text-align:center;margin-bottom:8px">${av(S.me.u,80)}</div><button class="mr" data-a="avlib"><span>Escolher da biblioteca</span></button><button class="mr" data-a="avcam"><span>Tirar foto</span></button><button class="mr" data-a="soon"><span>Importar do WhatsApp ou Facebook</span><i>em breve</i></button>${AVT[S.me.u]?'<button class="mr" data-a="avdel" style="color:#ff5a6a"><span>Remover foto atual</span></button>':''}`;
A.avatar=()=>{if(!ME)return;sheet(avHtml)};
A.avlib=()=>{const f=$('#fav');f.removeAttribute('capture');f.value='';f.click();shf=null;draw()};
A.avcam=()=>{const f=$('#fav');f.setAttribute('capture','user');f.value='';f.click();shf=null;draw()};
A.avdel=async()=>{shf=null;draw();if(!confirm('Remover sua foto de perfil?'))return;const old=AVT[S.me.u];
 const{error}=await sb.from('profiles').update({avatar_url:null}).eq('id',ME.id);if(error)return toast('Não foi possível remover agora');
 delete AVT[S.me.u];if(old&&old.includes('/media/'))sb.storage.from('media').remove([decodeURIComponent(old.split('/media/')[1].split('?')[0])]).catch(()=>{});R();toast('Foto removida')};

// ---------- Curtidas e comentários para todos (precisa do SQL; sem ele fica local) ----------
let LKOK=0,CMOK=0;
async function loadReact(list){if(!ME||!sb)return;const ids=list.filter(p=>p.oid).map(p=>String(p.oid)).slice(0,80);if(!ids.length)return;
 const[a,b]=await Promise.all([sb.from('likes').select('post_id,user_id').in('post_id',ids),sb.from('comments').select('post_id').in('post_id',ids)]);let ch=0;
 if(!a.error){LKOK=1;const c={},me={};(a.data||[]).forEach(r=>{c[r.post_id]=(c[r.post_id]||0)+1;if(r.user_id==ME.id)me[r.post_id]=1});
  list.forEach(p=>{if(p.oid){const n=c[String(p.oid)]||0,m=me[String(p.oid)]?1:0;if(p.l!=n||p.liked!=m){p.l=n;p.liked=m;ch=1}}})}
 if(!b.error){CMOK=1;const c={};(b.data||[]).forEach(r=>c[r.post_id]=(c[r.post_id]||0)+1);
  list.forEach(p=>{if(p.oid){const n=c[String(p.oid)]||0;if(p.cmn!==n){p.cmn=n;ch=1}}})}
 if(ch)R()}
{const lp=loadPosts;loadPosts=async m=>{await lp(m);loadReact(S.posts)}}
{const o=A.like;A.like=async id=>{const p=find(id);if(!p||!p.oid||!LKOK)return o(id);
 const was=p.liked;p.liked=was?0:1;p.l=Math.max(0,p.l+(was?-1:1));pop=p.liked?id:null;if(p.liked&&navigator.vibrate)navigator.vibrate(12);R();pop=null;
 const q=was?sb.from('likes').delete().eq('post_id',String(p.oid)).eq('user_id',ME.id):sb.from('likes').insert({post_id:String(p.oid),user_id:ME.id});
 const{error}=await q;if(error){p.liked=was;p.l=Math.max(0,p.l+(was?1:-1));R();toast('Não foi possível curtir agora')}}}
{const oc=A.cm;A.cm=async id=>{oc(id);const p=find(id);if(!p||!p.oid||!CMOK)return;
 const{data}=await sb.from('comments').select('body,created_at,profiles(username)').eq('post_id',String(p.oid)).order('created_at',{ascending:true});
 if(data){p.cm=data.map(c=>({u:c.profiles?c.profiles.username:'?',x:c.body}));p.cmn=p.cm.length;draw()}}}
{const o=A.cms;A.cms=async id=>{const p=find(id);if(!p||!p.oid||!CMOK)return o(id);const i=$('#ci'),v=i.value.trim();if(!v)return;i.value='';
 const{error}=await sb.from('comments').insert({post_id:String(p.oid),user_id:ME.id,body:v});if(error)return toast('Não foi possível comentar agora');
 p.cm.push({u:S.me.u,x:v});p.cmn=p.cm.length;R()}}

// ---------- Aviso de nova versão (evita ficar preso na versão antiga em cache) ----------
if(location.protocol.startsWith('http'))setTimeout(()=>{fetch(location.href.split('#')[0].split('?')[0],{cache:'no-store'}).then(r=>r.text()).then(t=>{
 const m=t.match(/const VER='([^']+)'/);if(m&&m[1]!=VER){const b=document.createElement('button');b.id='upd';b.textContent='Nova versão disponível. Toque para atualizar';
  b.onclick=()=>{location.href=location.pathname+'?v='+m[1]};document.body.appendChild(b)}}).catch(()=>{})},4000);
</script>
