<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VELOVERSA</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5f5f8;--sf:#fff;--tx:#12121a;--mu:#6c6c7c;--ln:#e3e3ec;--ac:#6d4aff;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#0a0a0d;--sf:#16161b;--tx:#f4f4f7;--mu:#9a9aa8;--ln:#26262e;--ac:#8b6bff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0d;--sf:#16161b;--tx:#f4f4f7;--mu:#9a9aa8;--ln:#26262e;--ac:#8b6bff}}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:16px}html.big{font-size:19px}
html.calm *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--ac)}
#app{height:100%;max-width:480px;margin:auto;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--ln)}
.logo{display:flex;align-items:center;gap:8px;flex:1;font-weight:800;letter-spacing:.22em;font-size:.95rem}
.logo svg{width:26px;height:26px}
#main{flex:1;overflow:auto;overscroll-behavior:contain}
nav{display:flex;justify-content:space-around;align-items:center;padding:8px 0;border-top:1px solid var(--ln);background:var(--bg)}
nav button{padding:8px 14px;color:var(--mu);border-radius:12px}nav button.on{color:var(--tx)}
nav .cr{background:var(--ac);color:#fff;padding:8px 16px}
.demo{font-size:.72rem;color:var(--mu);text-align:center;padding:6px}
.row{display:flex;gap:14px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;min-width:66px;color:var(--mu)}
.rg{padding:3px;border-radius:50%;background:var(--ac)}.rg.s{background:var(--ln)}.rg.n{background:none;border:2px dashed var(--ln)}
.rg .av{border:3px solid var(--bg)}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;flex:none}
.pc{border-bottom:1px solid var(--ln);padding-bottom:10px}
.ph{display:flex;align-items:center;gap:10px;padding:10px 16px}.ph .mu{flex:1}
.mu{color:var(--mu);font-size:.8rem}
.lk{color:var(--ac);font-weight:600;font-size:.85rem}
.md{aspect-ratio:3/4;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.md img,.md video{width:100%;height:100%;object-fit:cover}
.gl{position:absolute;font-size:5rem;opacity:.25;font-style:normal;color:#fff}
.ac{display:flex;gap:4px;padding:6px 10px}.ac button{padding:6px}.ac .r{margin-left:auto}
.on{color:#ff3b6b}.on2{color:var(--ac)}
.tx{padding:0 16px;font-size:.92rem}.tx p{margin:4px 0}.tg{color:var(--ac)}
.tx a{cursor:pointer}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.gt{aspect-ratio:3/4;position:relative;overflow:hidden;cursor:pointer}.gt img{width:100%;height:100%;object-fit:cover}
.gt i{position:absolute;top:6px;right:6px;font-style:normal;font-size:.7rem;background:#0008;color:#fff;border-radius:6px;padding:1px 5px}
.hd{display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:700}.hd span{flex:1}
.li{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer}.li div{flex:1;min-width:0}.li p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--mu);padding:48px 24px}
.bt{background:var(--ac);color:#fff;border-radius:12px;padding:10px 16px;font-weight:600;width:100%}
.bt.g{background:var(--sf);color:var(--tx);border:1px solid var(--ln)}
.pf{display:flex;align-items:center;gap:24px;padding:12px 16px}.pf div{text-align:center}.pf b{display:block;font-size:1.1rem}
.tabs{display:flex;border-bottom:1px solid var(--ln)}.tabs button{flex:1;padding:12px;color:var(--mu)}.tabs .on{color:var(--tx);border-bottom:2px solid var(--tx)}
#sh{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}#sh[hidden],#ov[hidden],#sv[hidden]{display:none}
.bk{position:absolute;inset:0;background:#0009}
#sb{position:relative;max-width:480px;width:100%;margin:auto;background:var(--sf);border-radius:20px 20px 0 0;padding:16px;max-height:88%;overflow:auto;animation:up .2s}
@keyframes up{from{transform:translateY(30px);opacity:0}}
#sb h3{margin:0 0 12px}#sb .pc{border:0;margin:-16px -16px 0}
.tg2{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}
.sw{width:46px;height:28px;border-radius:14px;background:var(--ln);position:relative;transition:.2s}.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--ac)}.sw.on:after{left:21px}
#ov,#sv{position:fixed;inset:0;z-index:30;background:var(--bg)}#sv{background:#000;z-index:40}
#ov>div{max-width:480px;margin:auto;height:100%;display:flex;flex-direction:column}
.rl{flex:1;overflow:auto;scroll-snap-type:y mandatory;background:#000}
.rs{height:100%;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
.rs video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rr{position:absolute;right:10px;bottom:90px;display:flex;flex-direction:column;gap:14px;align-items:center;font-size:.75rem}
.rb{position:absolute;left:14px;right:70px;bottom:24px;font-size:.9rem;text-shadow:0 1px 4px #000a}
.rtop{position:absolute;top:8px;left:8px;z-index:2;color:#fff;display:flex;align-items:center;gap:10px;font-weight:700}
.stb{max-width:480px;margin:auto;height:100%;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
.stb img,.stb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pg{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:2}.pg i{flex:1;height:3px;background:#fff5;border-radius:2px;overflow:hidden}.pg i.d{background:#fff}.pg b{display:block;height:100%;background:#fff;animation:pr 5s linear forwards}
@keyframes pr{from{width:0}to{width:100%}}
.sh2{position:absolute;top:22px;left:12px;right:12px;display:flex;align-items:center;gap:8px;z-index:3;font-size:.85rem}.sh2 span{flex:1;opacity:.7}
.stx{position:relative;z-index:1;font-size:1.6rem;font-weight:700;text-align:center;padding:24px;text-shadow:0 2px 8px #0008}
.stb .l,.stb .r{position:absolute;top:70px;bottom:0;width:40%;z-index:2}.stb .l{left:0}.stb .r{right:0}
#msgs{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.bb{max-width:75%;padding:8px 12px;border-radius:16px;background:var(--sf);border:1px solid var(--ln);align-self:flex-start;overflow-wrap:anywhere}.bb.me{align-self:flex-end;background:var(--ac);color:#fff;border-color:var(--ac)}
.cb{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--ln)}.cb button{color:var(--ac);font-weight:600}
#tt{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:.85rem;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}#tt.on{opacity:1;color:var(--bg)}
#au{position:fixed;inset:0;z-index:60;overflow:auto;background:radial-gradient(520px 320px at 50% -5%,#6d4aff55,transparent),var(--bg)}#au[hidden]{display:none}
.ab{max-width:400px;margin:auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:32px 24px}.ab h1{margin:8px 0 0;font-size:1.7rem;letter-spacing:-.02em}.ab p{margin:0}
.pw{position:relative}.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ac);font-size:.8rem;font-weight:600}
.pbar{height:4px;border-radius:2px;background:var(--ln);overflow:hidden}.pbar i{display:block;height:100%;width:0;transition:.25s}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:.85rem;color:var(--mu)}.ck input{width:auto;margin-top:3px}.er{color:#ff5a6a;font-size:.85rem;min-height:1.2em}label.mu input{margin-top:4px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:20px;background:var(--sf);border:1px solid var(--ln);font-size:.8rem;margin:6px 0 0 16px;font-weight:600}
.pop svg{animation:pp .45s cubic-bezier(.2,2,.4,1)}@keyframes pp{0%{transform:scale(.4)}60%{transform:scale(1.5)}100%{transform:scale(1)}}
.bh{position:absolute;font-size:7rem;color:#fff;font-style:normal;animation:bh .8s ease-out forwards;pointer-events:none;text-shadow:0 4px 24px #ff3b6baa}@keyframes bh{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(1.6);opacity:0}}
.pc{background:var(--sf);border:1px solid var(--ln);border-radius:22px;margin:10px 12px;overflow:hidden}
.rg{background:conic-gradient(from 200deg,#8b6bff,#3d8bff,#d24bff,#8b6bff)}
.nt{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:4px 8px;font-size:.7rem;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header{background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(16px)}
nav .cr{background:linear-gradient(135deg,var(--ac),#3d8bff);box-shadow:0 6px 18px #6d4aff66}nav button,.ac button{transition:transform .12s}nav button:active,.ac button:active{transform:scale(.88)}
@media(max-width:899px){nav{margin:6px 12px 10px;border:1px solid var(--ln);border-radius:30px;background:color-mix(in srgb,var(--sf) 82%,transparent);backdrop-filter:blur(18px)}}
@media(min-width:900px){#app{max-width:none;padding-left:84px}#app>header,#main>*{max-width:560px;margin-left:auto;margin-right:auto}
nav{position:fixed;left:0;top:0;bottom:0;width:84px;flex-direction:column;justify-content:flex-start;gap:12px;padding-top:24px;border-top:0;border-right:1px solid var(--ln)}}
</style>
</head>
<body>
<div id="app">
<header id="hd"></header>
<main id="main"></main>
<nav aria-label="Navegação principal">
<button data-a="tab" data-i="home" aria-label="Início"></button>
<button data-a="tab" data-i="exp" aria-label="Explorar"></button>
<button class="cr" data-a="create" aria-label="Criar"></button>
<button data-a="tab" data-i="msg" aria-label="Mensagens"></button>
<button data-a="tab" data-i="me" aria-label="Perfil"></button>
</nav>
</div>
<div id="sh" hidden><div class="bk" data-a="close"></div><div id="sb"></div></div>
<div id="au" hidden></div><div id="ov" hidden></div><div id="sv" hidden></div><div id="tt" role="status"></div>
<input type="file" id="fi" hidden>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P={home:'M3 11l9-8 9 8v10h-6v-6H9v6H3z',search:'M11 4a7 7 0 100 14 7 7 0 000-14zM21 21l-5-5',plus:'M12 5v14M5 12h14',send:'M22 3L9.5 13.5M22 3l-7 18-5.5-7.5L2 10z',user:'M12 3a4.5 4.5 0 100 9 4.5 4.5 0 000-9zM4 21c0-4.4 3.6-7 8-7s8 2.6 8 7',heart:'M12 21s-8-5-8-11a4.5 4.5 0 018-3 4.5 4.5 0 018 3c0 6-8 11-8 11z',cm:'M21 12a8 8 0 01-11.5 7.2L3 21l1.8-6A8 8 0 1121 12z',bm:'M6 3h12v18l-6-4-6 4z',reel:'M4 4h16v16H4zM10 9l5 3-5 3z',x:'M5 5l14 14M19 5L5 19',menu:'M4 6h16M4 12h16M4 18h16',back:'M15 5l-7 7 7 7',edit:'M4 20h4L19 9l-4-4L4 16zM14 6l4 4'};
const ic=(n,f)=>`<svg viewBox="0 0 24 24" width="24" height="24" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const hh=u=>Math.abs([...String(u)].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7))%360;
const art=h=>`background:linear-gradient(145deg,hsl(${h} 70% 48%),hsl(${(h+70)%360} 75% 22%))`;
const av=(u,s=40)=>`<span class="av" style="width:${s}px;height:${s}px;${art(hh(u))}">${esc((u||'?')[0]).toUpperCase()}</span>`;
const ago=t=>{const m=(Date.now()-t)/6e4|0;return m<1?'agora':m<60?m+' min':m<1440?(m/60|0)+' h':(m/1440|0)+' d'};
const tags=s=>esc(s).replace(/#\w+/g,m=>`<span class="tg">${m}</span>`);
const U=['lumen.studio','nina.rocha','orbita','kaue.dev','marina.lima'];
const CAP=['Luz da tarde e silêncio #luz #foco','Novo projeto saindo do forno #design #veloversa','Fim de semana sem plano #descanso','Código, café e playlist nova #dev','Cores do dia #arte #cor','Caminhada ao amanhecer #foco #natureza'];
let S=null;try{S=JSON.parse(localStorage.getItem('vv1'))}catch(e){}
if(!S)S={theme:'dark',me:{u:'voce',n:'Seu nome',b:'Bem-vindo ao VELOVERSA ✦'},priv:0,big:0,calm:0,fol:{},my:[],
 posts:CAP.map((c,i)=>({id:'s'+i,u:U[i%5],cap:c,t:Date.now()-(i+1)*108e5,l:3+i*2,liked:0,saved:0,art:i*61+20,type:i%2?'reel':'post',cm:i==0?[{u:'nina.rocha',x:'Que cena linda!'}]:[]})),
 chats:{'nina.rocha':[{m:0,x:'Oi! Viu o novo projeto?'}],'kaue.dev':[{m:0,x:'Bora testar o app hoje?'}]}};
const save=()=>{try{localStorage.setItem('vv1',JSON.stringify(S,(k,v)=>k=='vid'?undefined:v))}catch(e){toast('Armazenamento cheio: libere espaço')}};
S.top=S.top||{};S.str=S.str||{d:0,n:0};S.links=S.links||[];S.note=S.note||'';
let mode=S.acct?'in':'up',fails=0,lock=0,aw=0,pop=null;
const dayN=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
function streak(){const d=dayN();if(S.str.d==d)return;S.str.n=S.str.d==d-1?S.str.n+1:1;S.str.d=d;save()}
const s64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hp(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return s64(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,256))}
const pwScore=p=>[p.length>=8,/[A-Z]/.test(p)&&/[a-z]/.test(p),/\d/.test(p),/[^\w\s]/.test(p)].filter(Boolean).length;
const sc=p=>{let s=-(Date.now()-p.t)/36e5;(p.cap.match(/#\w+/g)||[]).forEach(h=>s+=(S.top[h]||0)*6);return s};
const allTags=()=>[...new Set(S.posts.flatMap(p=>p.cap.match(/#\w+/g)||[]))];
const authHtml=()=>{const up=mode=='up';return `<div class="ab"><div class="logo" style="flex:none;justify-content:center;font-size:1.1rem">${LOGO}VELOVERSA</div><h1>${up?'Crie sua conta':'Bem-vindo de volta'}</h1><p class="mu">${up?'Compartilhe momentos, descubra tendências e crie comunidades.':'Entre para continuar no seu universo.'}</p>${up?'<input id="ae" type="email" autocomplete="email" placeholder="E-mail" aria-label="E-mail"><input id="auu" autocomplete="username" autocapitalize="none" maxlength="20" placeholder="Nome de usuário" aria-label="Nome de usuário">':'<input id="ai" autocomplete="username" autocapitalize="none" placeholder="E-mail" aria-label="E-mail">'}<div class="pw"><input id="ap" type="password" autocomplete="${up?'new-password':'current-password'}" placeholder="Senha" aria-label="Senha"><button type="button" class="eye" data-a="eye">Mostrar</button></div>${up?'<div class="pbar"><i id="pb"></i></div><label class="mu">Data de nascimento<input id="ab" type="date"></label><label class="ck"><input id="at" type="checkbox"> Aceito os Termos de Uso e a Política de Privacidade</label>':''}<p id="er" class="er" role="alert"></p><button class="bt" data-a="auth">${up?'Criar conta':'Entrar'}</button><button class="lk" data-a="mode">${up?'Já tenho conta':'Criar conta nova'}</button><p class="mu" style="font-size:.72rem;text-align:center">Conta online: use o mesmo login em qualquer aparelho.</p></div>`};
const authShow=()=>{const a=$('#au');a.hidden=false;a.innerHTML=authHtml()};
document.addEventListener('input',e=>{if(e.target.id=='ap'&&mode=='up'){const n=pwScore(e.target.value),b=$('#pb');b.style.width=n*25+'%';b.style.background=['#e5484d','#e5484d','#f5a524','#3dd68c','#3dd68c'][n]}});
const algoHtml=()=>`<h3>Seu algoritmo</h3><p class="mu">Escolha o que aparece mais ou menos no seu feed. Isso muda a ordem real das publicações.</p>${allTags().map(h=>`<div class="tg2"><span>${h}</span><button class="lk" data-a="topic" data-i="${h}">${['Ocultar','Normal','Mais'][(S.top[h]||0)+1]}</button></div>`).join('')}`;
let tab='home',shf=null,ovf=null,seen={},tm,pend={},cur='',q='';
const find=id=>S.posts.find(p=>p.id==id);
function toast(t){const e=$('#tt');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
function theme(){document.documentElement.dataset.theme=S.theme;document.documentElement.classList.toggle('big',!!S.big);document.documentElement.classList.toggle('calm',!!S.calm)}
const LOGO=`<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 8l11 18L27 8" fill="none" stroke="var(--ac)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="5.5" r="2.6" fill="var(--tx)"/></svg>`;
const media=p=>(p.img?`<img src="${p.img}" alt="Foto de ${esc(p.u)}">`:p.vid?`<video src="${p.vid}" playsinline muted loop controls></video>`:`<i class="gl">✦</i>${p.v?'<span class="mu" style="position:relative;color:#fff">Vídeo disponível só na sessão em que foi enviado</span>':''}`);
const card=p=>`<article class="pc"><div class="ph">${av(p.u,34)}<b>${esc(p.u)}</b><span class="mu">${ago(p.t)}</span>${p.u!=S.me.u?`<button class="lk" data-a="fol" data-i="${esc(p.u)}">${S.fol[p.u]?'Seguindo':'Seguir'}</button>`:''}</div>
<div class="md" style="${p.img||p.vid?'':art(p.art||200)}" data-a="dbl" data-i="${p.id}">${media(p)}</div>
<div class="ac"><button data-a="like" data-i="${p.id}" class="${p.liked?'on':''}${pop==p.id?' pop':''}" aria-label="Curtir">${ic('heart',p.liked)}</button><button data-a="cm" data-i="${p.id}" aria-label="Comentar">${ic('cm')}</button><button data-a="shr" data-i="${p.id}" aria-label="Compartilhar">${ic('send')}</button><button class="r ${p.saved?'on2':''}" data-a="sv" data-i="${p.id}" aria-label="Salvar">${ic('bm',p.saved)}</button></div>
<div class="tx"><b>${p.l} curtidas</b><p><b>${esc(p.u)}</b> ${tags(p.cap)}</p><a data-a="cm" data-i="${p.id}" class="mu">${p.cm.length?`Ver ${p.cm.length} comentário(s)`:'Comentar'}</a></div></article>`;
const tile=p=>`<div class="gt" data-a="open" data-i="${p.id}" style="${p.img?'':art(p.art||200)}" role="button" aria-label="Abrir publicação">${p.img?`<img src="${p.img}" alt="">`:''}${p.type=='reel'?'<i>▶ Reel</i>':''}</div>`;
const myStories=()=>S.my.filter(s=>Date.now()-s.t<864e5);
function ring(u,l){const mine=u==S.me.u,n=mine?myStories().length:1;return `<button class="st" data-a="story" data-i="${esc(u)}"><span class="rg ${mine&&!n?'n':seen[u]?'s':''}">${av(u,56)}</span>${esc(l||u).slice(0,10)}</button>`}
const V={
home(){const reels=S.posts.filter(p=>p.type=='reel');const L=S.posts.filter(p=>p.u==S.me.u||!(p.cap.match(/#\w+/g)||[]).some(h=>S.top[h]<0)).sort((a,b)=>sc(b)-sc(a));
 const strip=reels.length?`<div class="hd"><span>Reels sugeridos</span></div><div class="row">${reels.map(p=>`<div class="gt" style="width:110px;height:170px;border-radius:12px;flex:none;${p.img?'':art(p.art||200)}" data-a="reels" data-i="${p.id}" role="button" aria-label="Abrir Reels"><i>▶</i></div>`).join('')}</div>`:'';

async function loadU(t){let r=sb.from('profiles').select('id,username,is_private').neq('id',ME.id).limit(20);
 if(t)r=r.ilike('username','%'+t.replace(/[%_,]/g,'')+'%');const{data}=await r;U.length=0;
 (data||[]).forEach(p=>{U.push(p.username);ID[p.username]=p.id;PRIV[p.username]=p.is_private});const x=$('#res');if(x)x.innerHTML=res()}
async function loadChats(){
 const{data:m}=await sb.from('conversation_members').select('conversation_id,user_id,profiles(username)').neq('user_id',ME.id);
 const{data:ms}=await sb.from('messages').select('conversation_id,sender,body').order('created_at',{ascending:false}).limit(300);
 S.chats={};CID={};const by={};
 (m||[]).forEach(r=>{const u=r.profiles.username;CID[u]=r.conversation_id;ID[u]=r.user_id;S.chats[u]=[];by[r.conversation_id]=u});
 (ms||[]).reverse().forEach(x=>{const u=by[x.conversation_id];u&&S.chats[u].push({m:x.sender==ME.id?1:0,x:x.body})});
 if(tab=='msg')R()}
function watch(){if(chan)return;chan=sb.channel('msgs').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{
 const x=p.new;if(x.sender==ME.id)return;const u=Object.keys(CID).find(k=>CID[k]==x.conversation_id);if(!u){loadChats();return}
 (S.chats[u]=S.chats[u]||[]).push({m:0,x:x.body});const i=$('#mi'),v=i?i.value:'';R();if(v&&$('#mi'))$('#mi').value=v}).subscribe()}
A.auth=async()=>{if(!sb)return erx('Sem conexão com o servidor.');const pw=$('#ap').value;
 if(mode=='up'){const e=$('#ae').value.trim().toLowerCase(),u=$('#auu').value.trim().toLowerCase(),bd=$('#ab').value;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return erx('Informe um e-mail válido.');
  if(!/^[a-z0-9._]{3,20}$/.test(u))return erx('Usuário: 3 a 20 letras minúsculas, números, . ou _');
  if(pw.length<8||pwScore(pw)<3)return erx('Senha fraca: use 8+ caracteres com maiúsculas, minúsculas e números.');
  if(!bd)return erx('Informe sua data de nascimento.');const age=(Date.now()-new Date(bd))/315576e5;if(!(age>=13))return erx('O VELOVERSA é para maiores de 13 anos.');
  if(!$('#at').checked)return erx('Aceite os termos para continuar.');
  const{data,error}=await sb.auth.signUp({email:e,password:pw,options:{data:{username:u,priv:age<18}}});
  if(error)return erx(/database|already|registered/i.test(error.message)?'Usuário ou e-mail já existe.':error.message);
  if(!data.session){mode='in';authShow();return erx('Conta criada! Confirme o e-mail que enviamos e depois entre.')}
  await boot(data.session)}
 else{const{data,error}=await sb.auth.signInWithPassword({email:$('#ai').value.trim().toLowerCase(),password:pw});
  if(error)return erx(/api key/i.test(error.message)?error.message:'E-mail ou senha incorretos.');await boot(data.session)}
 if(!S.sess)return erx('Perfil não encontrado.');tab='home';render();toast('Bem-vindo ao VELOVERSA')};
A.mode=()=>{mode=mode=='up'?'in':'up';authShow()};
A.out=async()=>{await sb.auth.signOut();S.sess=0;ME=null;S.chats={};S.fol={};if(chan){sb.removeChannel(chan);chan=null}save();shut();render()};
A.fol=async u=>{const id=ID[u];if(!id)return toast('Perfil de demonstração');
 if(S.fol[u]){const{error}=await sb.from('follows').delete().eq('follower',ME.id).eq('following',id);if(error)return toast('Erro ao atualizar');S.fol[u]=false}
 else{const{error}=await sb.from('follows').insert({follower:ME.id,following:id,status:PRIV[u]?'pending':'ok'});if(error)return toast('Erro ao seguir');S.fol[u]=true;if(PRIV[u])return toast('Pedido enviado a '+u),R()}
 toast(S.fol[u]?'Seguindo '+u:'Deixou de seguir');R()};
{const o=A.tab;A.tab=t=>{o(t);if(!ME)return;if(t=='exp')loadU(q||'');if(t=='msg')loadChats()}}
{const o=A.newc;A.newc=async()=>{await loadU('');o()}}
A.chat=async u=>{cur=u;if(!CID[u]){const{data,error}=await sb.rpc('start_dm',{other:ID[u]});if(error)return toast('Não foi possível abrir a conversa');CID[u]=data}
 S.chats[u]=S.chats[u]||[];shf=null;ovl(()=>chatHtml(u))};
A.ms=async u=>{const i=$('#mi'),v=i.value.trim();if(!v)return;i.value='';
 const{error}=await sb.from('messages').insert({conversation_id:CID[u],body:v});if(error)return toast('Não foi possível enviar');
 (S.chats[u]=S.chats[u]||[]).push({m:1,x:v});draw();render();const n=$('#mi');n&&n.focus()};
{const o=A.esave;A.esave=async()=>{const u=$('#eu').value.trim().toLowerCase();
 const{error}=await sb.from('profiles').update({username:u,name:$('#en').value.trim()||u,bio:$('#eb').value.trim()}).eq('id',ME.id);
 if(error)return toast(/duplicate|unique/i.test(error.message)?'Este nome de usuário já existe':'Usuário inválido');o()}}
{const o=A.tgl;A.tgl=k=>{o(k);k=='priv'&&ME&&sb.from('profiles').update({is_private:!!S.priv}).eq('id',ME.id).then(()=>{})}}
document.addEventListener('input',e=>{if(e.target.id=='q'&&ME){clearTimeout(qt);qt=setTimeout(()=>loadU(e.target.value.trim().toLowerCase().replace(/^@/,'')),300)}});
(async()=>{if(!sb){S.sess=0;render();return toast('Sem conexão com o servidor')}
 const{data:{session}}=await sb.auth.getSession();if(session)await boot(session);else S.sess=0;
 try{if(!localStorage.getItem('vvacct'))mode='up'}catch(e){}render()})();
</script>
</body>
